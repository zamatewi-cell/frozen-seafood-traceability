# ==============================================================================
# 冷冻海产品溯源系统 - 部署与本地开发数据库环境编排
# 数据库基线: MySQL 8.4 LTS
# 端口映射: 宿主机 3307 -> 容器 3306 (严格规避宿主机本地可能存在的 3306 端口冲突)
# ==============================================================================

services:
  mysql:
    image: mysql:8.4.0
    container_name: seafood-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --explicit_defaults_for_timestamp=1
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the repository .env file}
      MYSQL_DATABASE: ${DB_NAME:-seafood_trace}
      MYSQL_USER: ${DB_USERNAME:-trace_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the repository .env file}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seafood-network

volumes:
  mysql_data:
    name: seafood_mysql_data

networks:
  seafood-network:
    name: seafood-network
    driver: bridge
