name: Frontend CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'test/**'
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build-test:
    name: Frontend Quality & Browser Tests (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies (npm ci)
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Run TypeScript typecheck (vue-tsc)
        working-directory: web
        run: npm run typecheck

      - name: Run Vitest unit & component tests
        working-directory: web
        run: npm run test:unit

      - name: Build production bundle
        working-directory: web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E browser checks (360px, 390px, desktop)
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
