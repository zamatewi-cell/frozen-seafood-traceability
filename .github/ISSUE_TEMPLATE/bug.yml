name: 缺陷报告
description: 报告可复现的错误、越权、数据或文档问题
title: "[Bug] "
labels: []
body:
  - type: dropdown
    id: severity
    attributes:
      label: 严重度
      options:
        - S0 - 数据严重破坏、密钥泄漏或完全不可用
        - S1 - 越权、串组织或核心闭环不可用
        - S2 - 主要功能错误但有绕过方式
        - S3 - 轻微显示、易用性或文档问题
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 分支/提交、浏览器、系统、服务端与数据库版本。
    validations:
      required: true
  - type: textarea
    id: precondition
    attributes:
      label: 前置条件与测试数据
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图与影响范围
      description: 请先移除令牌、密码、个人信息和真实商业数据。
