        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /transfers/{transferId}:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Transfers]
      summary: 查询单个交接凭证详情
      operationId: getTransferDetail
      responses:
        '200':
          description: 交接凭证详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Transfers]
      summary: 发货企业修改交接凭证草稿
      description: 已绑定运输任务的草稿禁止修改接收方（409 `TRANSFER_BOUND_TO_SHIPMENT`），需先解绑。
      operationId: patchTransferDraft
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferPatchRequest'}
      responses:
        '200':
          description: 交接草稿修改成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Transfers]
      summary: 发货企业逻辑删除交接凭证草稿
      description: |
        已绑定运输任务的草稿：按 shipment → transfer 顺序加锁，运输任务必须仍为 PLANNED（否则 409 `SHIPMENT_NOT_PLANNED`），
        删除时清除绑定并递增运输任务版本，使持有旧版本号的发运请求被检测为冲突。
      operationId: deleteTransferDraft
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: 交接凭证草稿已逻辑删除
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /transfers/{transferId}/submit:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Transfers]
      summary: 发货企业提交交接凭证（DRAFT -> PENDING）
      description: |
        前提：交接已绑定 PLANNED 运输任务（未绑定 409 `SHIPMENT_NOT_BOUND`，运输任务非 PLANNED 409 `SHIPMENT_NOT_PLANNED`）。
        提交不发运运输任务、不生成 TRANSPORT，也不改变批次责任组织。
      operationId: submitTransfer
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferSubmitRequest'}
      responses:
        '200':
          description: 交接凭证提交成功并转入在途状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /transfers/{transferId}/accept:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Transfers]
      summary: 接收企业确认接受交接（PENDING -> ACCEPTED）
      description: |
        前提：关联运输任务已 DELIVERED（否则 409 `SHIPMENT_NOT_DELIVERED`），批次仍为 `ACTIVE + NORMAL`。
        原子转移批次当前责任组织与公开追溯码归属；批次数量不变；**不生成 ARRIVAL**（ARRIVAL 唯一来源为运输任务到达）。
        承运组织与发货组织不能接受交接（403 `ORG_SCOPE_DENIED`）。
      operationId: acceptTransfer
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferAcceptRequest'}
      responses:
        '200':
          description: 确认接受交接成功，批次当前责任组织已转移为接收方
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /transfers/{transferId}/reject:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      tags: [Transfers]
      summary: 接收企业拒收交接（PENDING -> REJECTED）
      description: 前提：关联运输任务已 DELIVERED（否则 409 `SHIPMENT_NOT_DELIVERED`）。拒收不改变批次责任组织，不生成追溯事件。
      operationId: rejectTransfer
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRejectRequest'}
      responses:
        '200':
          description: 拒收交接成功，批次保留在发货企业
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /shipments:
    get:
      tags: [Shipments]
      summary: 分页查询当前组织参与的运输任务
      description: 发货方、承运方与接收方均可读取本组织参与的运输任务（包括历史记录）；无关组织看不到任何记录。
      operationId: listShipments
      parameters:
        - name: role
          in: query
          description: 视角（SENDER=我发起的, CARRIER=我承运的, RECEIVER=发往我的）；省略表示任一参与方
          schema: {type: string, enum: [SENDER, CARRIER, RECEIVER]}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ShipmentStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 运输任务分页列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentListEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Shipments]
      summary: 发货方创建 PLANNED 运输任务
      description: |
        发送组织为当前登录组织；接收组织由目的场所所属组织确定。
        - 承运组织必须为启用的 `CARRIER` 类型组织（422 `CARRIER_ORG_INVALID`，Demo MVP Phase A 限制）；
        - 启运场所必须属于发货方且启用（422 `SITE_ORG_MISMATCH` / `SITE_NOT_ACTIVE`）；
        - 目的场所必须属于其他启用的非承运组织（422 `SHIPMENT_SAME_ORGANIZATION` / `RECEIVER_ORG_TYPE_NOT_ALLOWED`）；
        - 承运组织不能作为发货方（403 `ROLE_NOT_ALLOWED`）。
      operationId: createShipment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipmentCreateRequest'}
      responses:
        '201':
          description: 运输任务已创建（PLANNED）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /shipments/{shipmentId}:
    parameters:
      - {$ref: '#/components/parameters/ShipmentId'}
    get:
      tags: [Shipments]
      summary: 查询运输任务详情（含装载清单）
      description: 仅发货方、承运方、接收方可读（存在但无权 403 `ORG_SCOPE_DENIED`，不存在 404）。
      operationId: getShipment
      responses:
        '200':
          description: 运输任务详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /shipments/{shipmentId}/transfers:
    parameters:
      - {$ref: '#/components/parameters/ShipmentId'}
    post:
      tags: [Shipments]
      summary: 发货方把本组织 DRAFT 交接绑定到 PLANNED 运输任务
      description: |
        锁顺序 shipment → transfer → batch；绑定递增运输任务与交接版本。
        - 运输任务非 PLANNED：409 `SHIPMENT_NOT_PLANNED`（发运后禁止增删交接）；
        - 交接非 DRAFT：409 `INVALID_STATE_TRANSITION`；已绑定：409 `TRANSFER_BOUND_TO_SHIPMENT`；
        - 交接接收方与运输任务不一致：422 `SHIPMENT_PARTY_MISMATCH`（数据库复合外键兜底）；
        - 同一批次已在装载清单中：409 `SHIPMENT_BATCH_DUPLICATE`（数据库唯一约束兜底）。
      operationId: bindShipmentTransfer
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipmentBindTransferRequest'}
      responses:
        '200':
          description: 已绑定，返回最新运输任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /shipments/{shipmentId}/transfers/{transferId}:
    parameters:
      - {$ref: '#/components/parameters/ShipmentId'}
      - name: transferId
        in: path
        required: true
        schema: {type: integer, format: int64}
    delete:
      tags: [Shipments]
      summary: 发货方把 DRAFT 交接从 PLANNED 运输任务解绑
      description: 锁顺序 shipment → transfer；已提交 (PENDING) 的交接不能移出装载清单；解绑递增运输任务版本。
      operationId: unbindShipmentTransfer
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - name: expectedTransferVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: 已解绑，返回最新运输任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /shipments/{shipmentId}/dispatch:
    parameters:
      - {$ref: '#/components/parameters/ShipmentId'}
    post:
      tags: [Shipments]
      summary: 承运商确认装载发运（PLANNED -> IN_TRANSIT）
      description: |
        仅运输任务指定的承运组织可操作。装载清单不能为空（409 `SHIPMENT_EMPTY`），全部交接必须已 PENDING
        （409 `SHIPMENT_TRANSFER_NOT_PENDING`）；`expectedVersion` 与当前版本不一致（装载清单已变化）返回 409 `VERSION_CONFLICT`。
        成功时为装载清单中每个 Batch 生成且仅生成一条 TRANSPORT（`occurredAt = loadedAt`，来源对象为该运输任务）；
        交接状态与批次责任组织均不变。
      operationId: dispatchShipment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipmentDispatchRequest'}
      responses:
        '200':
          description: 已发运（IN_TRANSIT）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /shipments/{shipmentId}/arrive:
    parameters:
      - {$ref: '#/components/parameters/ShipmentId'}
    post:
      tags: [Shipments]
      summary: 承运商确认物理到达（IN_TRANSIT -> DELIVERED）
      description: |
        仅运输任务指定的承运组织可操作；`unloadedAt` 不得早于 `loadedAt`（422 `INVALID_BUSINESS_TIME`）。
        成功时为每个 Batch 生成且仅生成一条 ARRIVAL（只表示物理到达）；交接保持 PENDING，由接收方另行 ACCEPT / REJECT。
      operationId: arriveShipment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipmentArriveRequest'}
      responses:
        '200':
          description: 已到达（DELIVERED）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /shipments/{shipmentId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ShipmentId'}
    post:
      tags: [Shipments]
      summary: 发货方取消 PLANNED 运输任务（PLANNED -> CANCELLED）
      description: 装载清单中全部交接必须仍为 DRAFT（否则 409 `SHIPMENT_TRANSFER_NOT_DRAFT`）；取消时一并解绑这些草稿。
      operationId: cancelShipment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShipmentCancelRequest'}
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShipmentEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /public/traces/{publicTraceId}:
    servers:
      - url: /api/public/v1
    get:
      tags: [Public]
      summary: 查询消费者公开追溯投影
      description: |
        匿名可访问，不需要 Session 或 CSRF。格式非法、不存在与已停用的公开码统一返回 404 `PUBLIC_TRACE_NOT_FOUND`。
        当前投影只包含目标 Batch 自身的有效事件，尚未聚合祖先谱系。
      operationId: getPublicTrace
      security: []
      parameters:
        - name: publicTraceId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z2-7]{26}$'
            minLength: 26
            maxLength: 26
      responses:
        '200':
          description: 严格白名单的消费者追溯结果
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/PublicTrace'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: TRACESESSION
  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema: {type: integer, format: int64}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: 来自 `GET /auth/csrf` 的会话绑定 CSRF 凭据。所有非 GET 的 `/api/v1` 请求都必须携带。
      schema: {type: string}
  responses:
    Problem:
      description: 标准问题详情
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LoginSuccess:
      description: 登录成功并设置安全会话 Cookie
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/SuccessEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/CurrentUser'}
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: {type: integer, minimum: 1, description: 当前页码}
        size: {type: integer, minimum: 1, maximum: 100, description: 每页记录数}
        totalElements: {type: integer, format: int64, minimum: 0, description: 符合条件的总记录数}
        totalPages: {type: integer, minimum: 0, description: 总页数}
    PagedResponseMeta:
      allOf:
        - {$ref: '#/components/schemas/ResponseMeta'}
        - type: object
          required: [page]
          properties:
            page: {$ref: '#/components/schemas/PageMeta'}
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        requestId: {type: string}
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: {type: string, example: X-CSRF-TOKEN}
        parameterName: {type: string, example: _csrf}
        token: {type: string}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, orgId, orgNo, orgName, orgType, roles, scopes]
      properties:
        userId: {type: integer, format: int64}
        username: {type: string}
        displayName: {type: string}
        orgId: {type: integer, format: int64}
        orgNo: {type: string}
        orgName: {type: string}
        orgType: {type: string}
        roles: {type: array, items: {type: string}}
        scopes: {type: array, items: {type: string}}
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, orgNo, name, orgType, status]
      description: 组织白名单摘要，不包含统一社会信用代码等敏感字段。
      properties:
        id: {type: integer, format: int64}
        orgNo: {type: string}
        name: {type: string}
        orgType: {type: string, description: 组织类型代码，例如 SOURCE / PROCESSOR / RETAILER / PLATFORM}
        status: {type: string, description: 组织状态代码}
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, INACTIVE]
      description: 产品主数据状态 (DRAFT 草稿, ACTIVE 启用, INACTIVE 停用)
    ProductCategory:
      type: string
      enum: [FISH, CRUSTACEAN, SHELLFISH, CEPHALOPOD, OTHER]
      description: 水产大类
    ProductSourceType:
      type: string
      enum: [DOMESTIC_CAPTURE, DOMESTIC_FARMED, IMPORT]
      description: 水产品来源类型
    RuleStatus:
      type: string
      enum: [DRAFT, ACTIVE, RETIRED]
      description: 温控规则状态 (DRAFT 草稿, ACTIVE 生效, RETIRED 废弃)
    RuleStageCode:
      type: string
      enum: [PROCESSING, STORAGE, TRANSPORT, RETAIL]
      description: 供应链环节代码
    TemperatureUnit:
      type: string
      enum: [CELSIUS]
      description: 温标单位 (强制 CELSIUS 摄氏度)
    Product:
      type: object
      additionalProperties: false
      required: [id, productCode, publicName, category, specification, sourceType, baseUnitCode, status, version]
      properties:
        id: {type: integer, format: int64}
