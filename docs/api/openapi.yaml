        仅当前责任组织的 OPERATOR 可对 `ACTIVE + NORMAL` 批次发起；同一批次同时最多一张未结束交接。
        接收方必须为启用的非承运组织（422 `RECEIVER_ORG_TYPE_NOT_ALLOWED`）：承运商不会成为批次当前责任组织。
