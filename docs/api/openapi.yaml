    BatchType:
      type: string
      readOnly: true
      enum: [SOURCE, PROCESSING, DISTRIBUTION, SALE]
      description: 批次环节类型（只读，由服务端决定）(SOURCE 来源/捕捞, PROCESSING 加工速冻, DISTRIBUTION 分销仓储, SALE 终端销售)；企业端创建接口只产生 SOURCE
    OriginType:
      type: string
      enum: [DOMESTIC_CAPTURE, DOMESTIC_FARMED, IMPORT]
      description: 水产品来源类型 (DOMESTIC_CAPTURE 国内捕捞, DOMESTIC_FARMED 国内养殖, IMPORT 进口)
    BatchFlowStatus:
      type: string
      enum: [DRAFT, ACTIVE, CLOSED]
      description: 批次流转状态 (DRAFT 草稿, ACTIVE 可流转, CLOSED 正常流转已结束)；状态机 DRAFT → ACTIVE → CLOSED
    BatchRiskStatus:
      type: string
      enum: [NORMAL, FROZEN, RECALLED]
      description: 批次风险状态 (NORMAL 正常, FROZEN 冻结待调查, RECALLED 已进入模拟召回)；与流转状态正交，禁止 DRAFT+FROZEN 与 DRAFT+RECALLED
    Batch:
      type: object
      additionalProperties: false
      description: |
        追溯批次白名单投影。正常业务写操作的共同前提是 `flowStatus=ACTIVE` 且 `riskStatus=NORMAL`。
        服务端另保存不可变的创建组织 `creationOrgId`（仅用于创建幂等作用域与审计），它不随 Transfer 改变、
        不对客户端开放写入，也**不**出现在本响应中。
      required: [id, orgId, productId, traceBatchNo, batchType, quantity, unitCode, originType, originText, flowStatus, riskStatus, version]
      properties:
        id: {type: integer, format: int64}
        orgId: {type: integer, format: int64, description: 当前责任组织 ID；只有 Transfer ACCEPTED 才会转移给接收方}
        productId: {type: integer, format: int64}
        traceBatchNo:
          type: string
          readOnly: true
          maxLength: 128
          description: 服务端生成的全局唯一追溯批次号，创建后不可修改，跨企业稳定。新建批次格式为 `TB-` + 26 位 Base32；V8 迁移的历史批次为 `TB-H-` + 64 位十六进制
          example: TB-ABCDEFGHIJKLMNOPQRSTUVWXYZ
        externalBatchNo: {type: string, maxLength: 64, description: 企业可选的外部批号，可重复，不作为批次身份；未填写时字段省略}
        batchType: {$ref: '#/components/schemas/BatchType'}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001, description: 批次声明数量（创建或产出时声明，提交后不原地改写）}
        remainingQuantity:
          type: number
          minimum: 0
          description: |
            派生剩余量 = 声明数量 - 已提交批次操作 INPUT 消耗量（Sale 与处置将在后续 Slice 加入）；`CLOSED` 批次为 0。
            批次操作 INPUT 必须等于该值。
        unitCode: {type: string, example: kg}
        originType: {$ref: '#/components/schemas/OriginType'}
        originText: {type: string, maxLength: 255}
        productionDate: {type: string, format: date}
        captureDate: {type: string, format: date}
        freezeDate: {type: string, format: date}
        shelfLifeDays: {type: integer, minimum: 1}
        flowStatus: {$ref: '#/components/schemas/BatchFlowStatus'}
        riskStatus: {$ref: '#/components/schemas/BatchRiskStatus'}
        producedByOperationId: {type: integer, format: int64, description: 产出该批次的批次操作ID（仅操作输出批次；未产出时省略）}
        consumedByOperationId: {type: integer, format: int64, description: 全量消耗该批次的已提交批次操作ID（非空时批次必为 CLOSED）}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        createdBy: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: integer, format: int64}
    CreateBatchRequest:
      type: object
      additionalProperties: false
      description: |
        来源批次创建请求。不包含 `batchType`、`traceBatchNo`、`orgId`、`creationOrgId`、`flowStatus`、`riskStatus`；
        这些字段由服务端决定（batchType 固定 SOURCE，状态固定 DRAFT/NORMAL，组织取自 Session），
        客户端夹带任何未声明字段时返回 400 `INVALID_REQUEST`。
      required: [productId, quantity, unitCode, originType, originText]
      properties:
        externalBatchNo: {type: string, maxLength: 64, description: 可选企业外部批号，可重复；空白视为未填写}
        productId: {type: integer, format: int64, description: 关联产品 ID，必须为 ACTIVE}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001, description: 批次声明数量（大于 0，最多 3 位小数）}
        unitCode: {type: string, enum: [kg], example: kg}
        originType: {$ref: '#/components/schemas/OriginType'}
        originText: {type: string, maxLength: 255}
        productionDate: {type: string, format: date}
        captureDate: {type: string, format: date}
        freezeDate: {type: string, format: date}
        shelfLifeDays: {type: integer, minimum: 1}
    UpdateBatchRequest:
      type: object
      description: 只更新提供的字段；`traceBatchNo` 与状态字段不可通过本接口修改。
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001, description: 修正后的批次声明数量}
        externalBatchNo: {type: string, maxLength: 64, description: 企业外部批号；传空白字符串表示清除}
        originText: {type: string, maxLength: 255}
        productionDate: {type: string, format: date}
        captureDate: {type: string, format: date}
        freezeDate: {type: string, format: date}
        shelfLifeDays: {type: integer, minimum: 1}
    SubmitBatchRequest:
