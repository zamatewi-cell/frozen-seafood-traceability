openapi: 3.1.0
info:
  title: 冷冻海产品溯源系统 API
  version: 0.4.0-phaseA-slice3
  description: |
    教学演练原型接口，不代表真实物联网、防伪或第三方认证能力。

    本文档仅描述当前仓库中已真实实现的接口（Phase 0 + Phase A Slice 1/2/3 基线），业务语义以
    `docs/BUSINESS_CONTRACT_V1.1.md` 为准。Sale、温度记录、告警、冻结、隔离 (QUARANTINED)、召回、
    检验报告及企业端谱系图等尚未实现的能力不在本文档中声明。

    ## Transfer 与 Shipment（Phase A Slice 2）

    唯一动作顺序：发货方创建 Transfer DRAFT → 创建 Shipment PLANNED 并绑定 → 提交 Transfer 为 PENDING
    → 承运商确认装载发运 (Shipment IN_TRANSIT，每个 Batch 自动生成一条 TRANSPORT)
    → 承运商确认到达 (Shipment DELIVERED，每个 Batch 自动生成一条 ARRIVAL)
    → 接收方 ACCEPT / REJECT。只有 ACCEPT 改变 Batch 当前责任组织；Shipment 与承运商从不改变责任组织；
    ACCEPT 不生成 ARRIVAL。所有改变装载清单的操作遵循 shipment → transfer → batch 行锁顺序并递增运输任务版本。

    **Demo MVP Phase A 阶段性限制**：承运方必须是独立的 `CARRIER` 类型组织，承运组织不能作为发货方创建运输任务，
    也不能作为交接接收方。统一业务契约 v1.1 未规定承运方必须与发送 / 接收方不同，因此该限制仅由应用层执行，
    未写入数据库永久约束，后续版本可以放开。

    ## BatchOperation：PROCESS / SPLIT（Phase A Slice 3）

    - 本 Slice 仅执行 `PROCESS` 与 `SPLIT`，且**恰好一个 INPUT**：PROCESS 至少 1 个 OUTPUT，SPLIT 至少 2 个 OUTPUT。
      多输入物料合并属于 MERGE 职责。`MERGE` / `REPACK` 仍在枚举中，但执行时返回 422 `OPERATION_TYPE_NOT_SUPPORTED`——
      **这是当前 Slice 的开发范围限制，不是永久业务规则**。
    - INPUT 必须全量消耗输入批次当前剩余量（`remainingQuantity`），禁止部分 INPUT（422 `PARTIAL_INPUT_NOT_ALLOWED`）；
      需要部分加工时先 SPLIT。
    - OUTPUT 批次由服务端在创建操作草稿时生成为 `DRAFT` + `NORMAL`（客户端不得指定 OUTPUT 的 `batchId`），
      不能通过普通批次接口修改或激活（409 `BATCH_OWNED_BY_OPERATION`）。PROCESS 产出 `batchType=PROCESSING`；
      SPLIT 产出继承输入批次的 `batchType`（SPLIT 只创建新的追溯身份，不声明发生了加工）。
    - 提交在同一事务内：全部 INPUT 变为 `CLOSED`、全部 OUTPUT 变为 `ACTIVE`、固化 BatchRelation；
      PROCESS 为每个 OUTPUT 自动生成一条 PROCESS 追溯事件；SPLIT 不生成 PACK 或 PROCESS。普通 PROCESS 不推导 FREEZE。
    - 物料平衡由服务端按数值精确校验：`sum(INPUT) = sum(OUTPUT) + sum(LOSS) + sum(WASTE) + sum(SAMPLE)`（不设容差，
      `1000.0` 与 `1000.000` 视为相等）。
    - 写操作仅限当前责任组织为 `PROCESSOR` 的 `OPERATOR`；读取对操作所属组织开放，批次转出后仍可只读查询本组织历史操作。

    ## 会话与 CSRF

    - 企业端使用服务端 Session：`POST /auth/login` 成功后下发 HttpOnly、SameSite=Lax 的
      `TRACESESSION` Cookie，登录时轮换 Session ID 以防会话固定。
    - 除 GET 外的所有 `/api/v1` 请求（包括 `login` 与 `logout`）都必须携带请求头
      `X-CSRF-TOKEN`，其值来自 `GET /auth/csrf`。CSRF 凭据保存在服务端 Session 中，
      缺失或错误时返回 403 `ACCESS_DENIED`。
    - `logout` 会使 Session 失效；之后任何写请求都必须重新获取 CSRF 凭据。
    - 已登录会话在每次请求时复核用户、组织和角色活性；任一失效时 Session 被作废并返回 401 `AUTH_REQUIRED`。
    - 未登录访问受保护接口返回 401 `AUTH_REQUIRED`（`application/problem+json`）。

    ## 序列化约定

    服务端 JSON 采用 `non_null` 序列化：值为 null 的可选字段在响应中**被省略**，而不是输出 `null`。
  license:
    name: Proprietary teaching project
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: 企业与管理端
tags:
  - name: Auth
    description: 登录、注销与当前用户
  - name: Batches
    description: 批次、批次操作与数量平衡
  - name: Trace
    description: 追溯事件与谱系查询
  - name: Transfers
    description: 企业交接确认
  - name: Organizations
    description: 企业端最小只读组织目录
  - name: Products
    description: 平台级产品主数据管理（企业用户只读）
  - name: TemperatureRules
    description: 分阶段版本化温控基准规则
  - name: Public
    description: 消费者公开白名单接口
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: 获取会话绑定的 CSRF 凭据
      description: 匿名可访问。若尚无 Session 会创建一个匿名 Session 并在其中保存 CSRF 凭据；后续写请求须把 `token` 放入 `headerName` 指定的请求头。
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: 获取 CSRF 凭据成功
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CsrfToken'}
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录并建立服务端会话
      description: |
        需要携带 `X-CSRF-TOKEN`。成功后轮换 Session ID 并返回当前用户白名单信息。
        用户名或密码错误、账户或组织不可用统一返回 401 `AUTH_CREDENTIALS_INVALID`；
        缺失 CSRF 凭据返回 403 `ACCESS_DENIED`；请求体校验失败返回 400 `INVALID_REQUEST`。
      operationId: login
      security: []
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/LoginSuccess'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      description: 需要已登录并携带 `X-CSRF-TOKEN`；成功后 Session 失效，返回 204 无响应体。
      operationId: logout
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 会话已注销}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /me:
    get:
      tags: [Auth]
      summary: 获取当前用户与数据范围
      description: 用于前端刷新页面后恢复会话。未登录或会话失效时返回 401 `AUTH_REQUIRED`。
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前会话主体
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Problem'}
  /organizations:
    get:
      tags: [Organizations]
      summary: 查询启用组织目录（交接接收方与承运方选择）
      description: |
        已认证企业用户可读取全部启用组织的白名单摘要，可按 `orgType` 筛选。
        只返回 `id/orgNo/name/orgType/status`；不提供创建、修改或删除能力。
      operationId: listOrganizations
      parameters:
        - name: orgType
          in: query
          schema:
            type: string
            enum: [SOURCE, PROCESSOR, WAREHOUSE, CARRIER, DISTRIBUTOR, RETAILER]
      responses:
        '200':
          description: 启用组织白名单摘要列表
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/OrganizationSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /organizations/{orgId}/sites:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Organizations]
      summary: 查询组织启用场所目录（运输任务起止场所 / 本组织冷库选择）
      description: 只返回场所白名单摘要，不含详细地址、版本号与审计字段。冷库出入库页面读取本组织目录并按 `siteType = COLD_STORE` 选择场所。
      operationId: listOrganizationSites
      responses:
        '200':
          description: 启用场所白名单摘要列表
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/SiteSummary'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /organizations/{orgId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Organizations]
      summary: 读取组织白名单摘要（最小只读目录）
      description: |
        已认证企业用户可读取任意组织的白名单摘要（交接与运输页面需要展示交易对手名称）；
        目标不存在或已逻辑删除返回 404 `RESOURCE_NOT_FOUND`。
        只返回 `id/orgNo/name/orgType/status`，绝不返回统一社会信用代码、版本号、审计人等字段。
      operationId: getOrganization
      responses:
        '200':
          description: 组织白名单摘要
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/OrganizationSummary'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /products:
    get:
      tags: [Products]
      summary: 分页多条件查询产品主数据列表
      description: 任意已登录用户可读；产品为平台级主数据，不按组织隔离。
      operationId: listProducts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: keyword
          in: query
          description: 产品编码或公开名称模糊匹配
          schema: {type: string}
        - name: category
          in: query
          description: 水产大类
          schema: {$ref: '#/components/schemas/ProductCategory'}
        - name: sourceType
          in: query
          description: 来源类型
          schema: {$ref: '#/components/schemas/ProductSourceType'}
        - name: status
          in: query
          description: 产品状态
          schema: {$ref: '#/components/schemas/ProductStatus'}
      responses:
        '200':
          description: 产品分页列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPage'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Products]
      summary: 创建海产品主数据（仅限全平台管理角色）
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductCreateRequest'}
      responses:
        '201':
          description: 创建产品成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [Products]
      summary: 查询指定海产品详情
      description: 任意已登录用户可读；企业端批次列表与详情用它展示产品名称和规格。
      operationId: getProduct
      responses:
        '200':
          description: 产品主数据详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Products]
      summary: 乐观锁更新海产品主数据（仅限全平台管理角色）
      operationId: patchProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductPatchRequest'}
      responses:
        '200':
          description: 更新产品成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /products/{productId}/temperature-rules:
    parameters:
      - name: productId
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [TemperatureRules]
      summary: 查询指定产品的温控规则版本及各环节明细
      operationId: listProductTemperatureRules
      responses:
        '200':
          description: 温控规则列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureRuleListEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [TemperatureRules]
      summary: 为海产品创建温控基准规则草稿（仅限全平台管理角色）
      operationId: createTemperatureRuleDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemperatureRuleCreateRequest'}
      responses:
        '201':
          description: 创建规则草稿成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureRuleEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /temperature-rules/{ruleId}/publish:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: {type: integer, format: int64}
    post:
      tags: [TemperatureRules]
      summary: 发布温控基准规则（仅限全平台管理角色）
      operationId: publishTemperatureRule
      responses:
        '200':
          description: 发布规则成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemperatureRuleEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /batches:
    get:
      tags: [Batches]
      summary: 按权限范围分页查询批次
      description: |
        数据范围：企业用户只能看到**当前责任组织**（`orgId`）为本组织的批次；
        PLATFORM 作用域可查询全平台批次。创建组织（服务端内部 `creationOrgId`）不参与列表可见性判断。
        结果按 `id` 倒序分页；`meta.page` 返回分页元数据。
        非法的 `flowStatus` / `riskStatus` 取值返回 400 `INVALID_REQUEST`。
      operationId: listBatches
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: traceBatchNo
          in: query
          description: 按服务端追溯批次号精确过滤
          schema: {type: string}
        - name: externalBatchNo
          in: query
          description: 按企业外部批号精确过滤（外部批号可重复，可能命中多条）
          schema: {type: string}
        - name: flowStatus
          in: query
          description: 按流转状态过滤
          schema: {$ref: '#/components/schemas/BatchFlowStatus'}
        - name: riskStatus
          in: query
          description: 按风险状态过滤
          schema: {$ref: '#/components/schemas/BatchRiskStatus'}
      responses:
        '200':
          description: 批次分页结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Batches]
      summary: 创建来源批次草稿（仅限来源组织的企业操作员）
      description: |
        企业端公开创建接口**只**建立来源批次：
        - 仅当前登录组织 `orgType=SOURCE` 且用户具有 `OPERATOR` 角色时可调用；
          非 SOURCE 组织返回 403 `ORG_TYPE_NOT_ALLOWED`，非 OPERATOR 返回 403 `ACCESS_DENIED`。
        - `batchType` 由服务端固定为 `SOURCE`，客户端不能选择或指定任何批次类型；
          PROCESSING 等输出批次未来只能由 BatchOperation 产生，本接口不创建。
        - 新批次固定为 `DRAFT` + `NORMAL`；`orgId`（当前责任组织）与内部 `creationOrgId`（创建组织）均取自当前 Session。
        - `traceBatchNo` 由服务端生成、全局唯一、只读，客户端**不能**指定或覆盖；`externalBatchNo` 可选、可重复（同组织与跨组织均可），不作为批次身份。
        - `unitCode` 在 Demo MVP 中固定为 `kg`。
        - 请求体只接受 `CreateBatchRequest` 声明的字段；夹带 `batchType`、`traceBatchNo`、`orgId`、`creationOrgId`、
          `flowStatus`、`riskStatus`、`status` 或任何其他未声明字段时返回 400 `INVALID_REQUEST`，不会静默忽略。
        - `Idempotency-Key` 的作用域是不可变的创建组织；同 key 同载荷重放返回原批次，同 key 不同载荷返回 409 `IDEMPOTENCY_KEY_REUSED`。
        - 关联产品不存在返回 404 `RESOURCE_NOT_FOUND`；产品非 ACTIVE 返回 422 `PRODUCT_NOT_ACTIVE`。
        - 创建草稿不产生任何追溯事件。
      operationId: createBatch
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBatchRequest'}
      responses:
        '201':
          description: 来源批次草稿（batchType=SOURCE，flowStatus=DRAFT，riskStatus=NORMAL）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /batches/{batchId}:
    parameters:
      - {$ref: '#/components/parameters/BatchId'}
    get:
      tags: [Batches]
      summary: 获取批次详情
      description: 企业用户只能读取当前责任组织为本组织的批次，否则 403 `ORG_SCOPE_DENIED`；不存在返回 404 `RESOURCE_NOT_FOUND`。
      operationId: getBatch
      responses:
        '200':
          description: 批次详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchEnvelope'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Batches]
      summary: 更新批次草稿（仅限企业操作员）
      description: 仅允许当前责任组织更新 `DRAFT` + `NORMAL` 批次的可变字段；`traceBatchNo` 不可修改。批次操作产出的 OUTPUT 草稿只能随操作提交激活，普通接口修改返回 409 `BATCH_OWNED_BY_OPERATION`。
      operationId: updateDraftBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateBatchRequest'}
      responses:
        '200':
          description: 已更新草稿
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /batches/{batchId}/submit:
    parameters:
      - {$ref: '#/components/parameters/BatchId'}
    post:
      tags: [Batches]
      summary: 提交激活来源批次（仅限来源组织的企业操作员），并自动生成 SOURCE 追溯事件
      description: |
        状态流转：`DRAFT` + `NORMAL` → `ACTIVE` + `NORMAL`，使用 `version` 乐观锁。前提条件与错误：
        - 当前登录组织 `orgType=SOURCE` 且具有 `OPERATOR` 角色，否则 403 `ORG_TYPE_NOT_ALLOWED` / `ACCESS_DENIED`；
        - 批次当前责任组织必须是本组织，且仍是创建该批次的来源组织，否则 403 `ORG_SCOPE_DENIED`；
        - 批次不存在 404 `RESOURCE_NOT_FOUND`；
        - 仅 `DRAFT` + `NORMAL` 可提交，否则 409 `INVALID_STATE_TRANSITION`；版本不一致 409 `VERSION_CONFLICT`；
        - 仅 `batchType=SOURCE` 可经本接口激活，否则 422 `BATCH_TYPE_NOT_SUBMITTABLE`；
        - 来源类型与来源描述必须完整，否则 422 `SOURCE_FIELDS_INCOMPLETE`；关联产品必须仍为 ACTIVE，否则 422 `PRODUCT_NOT_ACTIVE`。

        **副作用**：激活成功时，在同一数据库事务内自动追加且仅追加一条 SOURCE 追溯事件
        （`eventType=SOURCE`、`status=SUBMITTED`、`orgId`=来源组织、`operatorId`=提交人、`dataSource=MANUAL`，
        `occurredAt` 为提交激活时刻；`detailsJson` 保存 `sourceObjectType=BATCH`、`sourceObjectId`、`traceBatchNo`、`productId`、
        `originType`、`originText`、`quantity`、`unitCode`、可用的 `productionDate`/`captureDate`/`freezeDate`/`shelfLifeDays`
        与 `occurredAtBasis=BATCH_ACTIVATION`）。事件身份由服务端基于批次 ID 决定，同一批次无论并发或重复请求都至多一条 SOURCE；
        SOURCE 写入失败时批次激活整体回滚并返回 409 `SOURCE_EVENT_CONFLICT`。
      operationId: submitBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitBatchRequest'}
      responses:
        '200':
          description: 来源批次已激活为 ACTIVE/NORMAL，且已生成唯一 SOURCE 追溯事件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchEnvelope'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
