        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Batch'}
    BatchPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
        meta: {$ref: '#/components/schemas/PagedResponseMeta'}
    SubmitBatchOperationRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 期望当前乐观锁版本号}
    BatchOperationRelation:
      type: object
      required: [id, operationId, parentBatchId, childBatchId, relationType, createdAt]
      properties:
        id: {type: integer, format: int64, description: 谱系边ID}
        operationId: {type: integer, format: int64, description: 关联批次操作ID}
        parentBatchId: {type: integer, format: int64, description: 原料父批次ID}
        childBatchId: {type: integer, format: int64, description: 产出子批次ID}
        relationType: {type: string, enum: [MERGE, SPLIT, TRANSFORM], description: "关系类型（PROCESS → TRANSFORM，SPLIT → SPLIT）"}
        createdAt: {type: string, format: date-time, description: "创建时间（ISO 8601 带明确时区偏移）"}
    BatchOperationItem:
      type: object
      required: [id, operationId, role, quantity, unitCode, normalizedQuantity]
      description: 操作明细。INPUT / OUTPUT 项目附带关联批次摘要；LOSS / WASTE / SAMPLE 的批次字段省略。
      properties:
        id: {type: integer, format: int64, description: 操作明细项目ID}
        operationId: {type: integer, format: int64, description: 关联批次操作ID}
        batchId: {type: integer, format: int64, description: "关联批次ID（INPUT 与 OUTPUT 必有；OUTPUT 为服务端生成的批次）"}
        role: {type: string, enum: [INPUT, OUTPUT, LOSS, WASTE, SAMPLE], description: 项目角色}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001, description: "数量（kg），严格大于0，最多3位小数", example: 100.000}
        unitCode: {type: string, enum: [kg], example: kg, description: "计量单位，当前阶段仅支持 kg"}
        normalizedQuantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001, description: "折算基准数量（kg）", example: 100.000}
        traceBatchNo: {type: string, description: 关联批次追溯批次号}
        externalBatchNo: {type: string, description: 关联批次外部批号}
        productId: {type: integer, format: int64, description: 关联批次产品ID}
        batchType: {$ref: '#/components/schemas/BatchType'}
        batchFlowStatus: {$ref: '#/components/schemas/BatchFlowStatus'}
        batchRiskStatus: {$ref: '#/components/schemas/BatchRiskStatus'}
    BatchOperationItemRequest:
      type: object
      required: [role, quantity, unitCode]
      description: |
        - INPUT：必须提供 `batchId`，数量必须等于该批次当前全部剩余量；
        - OUTPUT：**不得**提供 `batchId`（输出批次由服务端生成）；可选 `productId`（仅 PROCESS 可改为其他 ACTIVE 产品，
          默认沿用输入产品；SPLIT 只能沿用输入产品）、`externalBatchNo`、`shelfLifeDays`；
        - LOSS / WASTE / SAMPLE：不得提供 `batchId` 与 OUTPUT 专属字段。
      properties:
        batchId: {type: integer, format: int64, description: "INPUT 必填；OUTPUT / LOSS / WASTE / SAMPLE 禁止"}
        role: {type: string, enum: [INPUT, OUTPUT, LOSS, WASTE, SAMPLE], description: 项目角色}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001, description: "数量（kg），严格大于0，最多3位小数", example: 100.000}
        unitCode: {type: string, enum: [kg], example: kg, description: "计量单位，当前阶段仅支持 kg"}
        productId: {type: integer, format: int64, minimum: 1, description: "仅 OUTPUT：产出产品"}
        externalBatchNo: {type: string, maxLength: 64, description: "仅 OUTPUT：产出批次外部批号"}
        shelfLifeDays: {type: integer, minimum: 1, description: "仅 OUTPUT：产出批次保质期天数"}
    CreateBatchOperationRequest:
      type: object
      required: [operationType, occurredAt, items]
      properties:
        operationType:
          type: string
          enum: [MERGE, SPLIT, PROCESS, REPACK]
          description: |
            操作类型。当前 Slice 仅执行 PROCESS 与 SPLIT；MERGE / REPACK 返回 422 `OPERATION_TYPE_NOT_SUPPORTED`
            （当前 Slice 范围限制，不是永久业务规则）。
        occurredAt: {type: string, format: date-time, description: "业务发生时间（ISO 8601 带毫秒与明确时区偏移，不得晚于当前时间）"}
        note: {type: string, maxLength: 500, description: 操作备注}
        items:
          type: array
          minItems: 2
          description: 恰好 1 个 INPUT；PROCESS 至少 1 个 OUTPUT，SPLIT 至少 2 个 OUTPUT。
          items: {$ref: '#/components/schemas/BatchOperationItemRequest'}
    BatchOperation:
      type: object
      required: [id, orgId, operationNo, operationType, occurredAt, recordedAt, status, balanced, version, createdAt, createdBy, updatedAt, updatedBy, items, relations]
      properties:
        id: {type: integer, format: int64, description: 操作ID}
        orgId: {type: integer, format: int64, description: 执行企业组织ID}
        operationNo: {type: string, description: 业务流水单号}
        operationType: {type: string, enum: [MERGE, SPLIT, PROCESS, REPACK], description: 操作类型}
        occurredAt: {type: string, format: date-time, description: "业务实际发生时间（ISO 8601 带毫秒与明确UTC偏移，如 yyyy-MM-dd'T'HH:mm:ss.SSSXXX）"}
        recordedAt: {type: string, format: date-time, description: "系统登记时间（ISO 8601 带毫秒与明确UTC偏移）"}
        status: {type: string, enum: [DRAFT, SUBMITTED, CORRECTED], description: 生命周期状态}
        note: {type: string, maxLength: 500, description: 操作备注}
        balanced: {type: boolean, description: "物料平衡结果：sum(INPUT) 与 sum(OUTPUT+LOSS+WASTE+SAMPLE) 数值精确相等"}
        inputTotal: {type: number, description: INPUT 合计（kg）}
        outputTotal: {type: number, description: OUTPUT 合计（kg）}
        lossTotal: {type: number, description: LOSS 合计（kg）}
        wasteTotal: {type: number, description: WASTE 合计（kg）}
        sampleTotal: {type: number, description: SAMPLE 合计（kg）}
        version: {type: integer, format: int64, minimum: 0, description: 乐观锁版本号}
        createdAt: {type: string, format: date-time, description: "创建时间（ISO 8601 带毫秒与明确UTC偏移）"}
        createdBy: {type: integer, format: int64, description: 创建人用户ID}
        updatedAt: {type: string, format: date-time, description: "最后更新时间（ISO 8601 带毫秒与明确UTC偏移）"}
        updatedBy: {type: integer, format: int64, description: 最后更新人用户ID}
        items: {type: array, items: {$ref: '#/components/schemas/BatchOperationItem'}}
        relations: {type: array, items: {$ref: '#/components/schemas/BatchOperationRelation'}}
    TraceEventType:
      type: string
      enum:
        - SOURCE
        - PURCHASE
        - PROCESS
        - FREEZE
        - PACK
        - WAREHOUSE_IN
        - WAREHOUSE_OUT
        - TRANSPORT
        - ARRIVAL
        - SALE
      description: |
        追溯事件类型枚举（仅限系统规定的10个环节）。自动投影类型（人工事件接口不得创建或更正）：
        SOURCE 由来源批次提交激活生成（`POST /batches/{batchId}/submit`）。
        **Slice 3 实现规则（已知契约歧义）**：SPLIT 产出继承输入批次类型，因此 SOURCE 批次拆分会得到 SOURCE 类型的子批次；
        这些子批次随批次操作提交激活时当前实现**不**生成新的 SOURCE 事件，其来源出处通过 BatchRelation / 谱系追溯到祖先批次。
        统一业务契约 v1.1 一方面把 SOURCE 触发源写为“SOURCE Batch 从 DRAFT/NORMAL 激活为 ACTIVE/NORMAL 且来源字段完整”，
        另一方面规定 SPLIT 谱系由 BatchOperation / BatchRelation 表达，并未明确处理 SOURCE 类型 SPLIT 子批次的情形；
        这是当前实现选择而非 v1.1 已明确保证的规范规则，可在后续契约修订中澄清。PROCESS 由 PROCESS 批次操作提交为每个 OUTPUT 批次生成一条
        （SPLIT 不生成 PACK / PROCESS，普通 PROCESS 不推导 FREEZE）；TRANSPORT 由运输任务 PLANNED → IN_TRANSIT 为每个 Batch 生成一条；
        ARRIVAL 由运输任务 IN_TRANSIT → DELIVERED 为每个 Batch 生成一条。Transfer ACCEPTED 不生成 ARRIVAL。
        SALE 只能由终端 Sale 提交生成（Sale 尚未实现，人工接口拒绝）。
        WAREHOUSE_IN / WAREHOUSE_OUT 为受控人工事件：当前责任组织在本组织启用的 COLD_STORE 场所记录，不改变批次，不强制配对或顺序（Slice 4 最小实现解释）。
    TraceEventDetailsJson:
      type: [object, 'null']
      maxProperties: 20
      propertyNames:
        pattern: '^[a-z][A-Za-z0-9]{0,63}$'
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
          - type: 'null'
      description: "受控单层业务扩展属性，最多20个属性，key为lowerCamelCase，禁止核心字段名，value为标量或null且字符串不超过500字符，UTF-8序列化不超过8KiB"
    TraceEvent:
      type: object
      required:
        - id
        - batchId
        - orgId
        - eventType
        - occurredAt
        - recordedAt
        - operatorId
        - dataSource
        - status
        - summary
      properties:
        id: {type: integer, format: int64, description: 内部事件ID}
        batchId: {type: integer, format: int64, description: 关联批次ID}
        orgId: {type: integer, format: int64, description: 记录组织ID}
        siteId: {type: [integer, 'null'], format: int64, description: 发生场所ID}
        eventType: {$ref: '#/components/schemas/TraceEventType'}
        occurredAt: {type: string, format: date-time, description: "业务实际发生时间（ISO 8601 带毫秒与明确UTC偏移）"}
        recordedAt: {type: string, format: date-time, readOnly: true, description: "系统登记时间（ISO 8601 带毫秒与明确UTC偏移）"}
        operatorId: {type: [integer, 'null'], format: int64, description: 记录操作员用户ID}
        dataSource: {$ref: '#/components/schemas/DataSource'}
        status: {type: string, enum: [SUBMITTED, CORRECTED], description: 事件当前状态}
        summary: {type: string, maxLength: 500, description: 事件核心摘要说明}
        detailsJson: {$ref: '#/components/schemas/TraceEventDetailsJson'}
        correctsEventId: {type: [integer, 'null'], format: int64, description: 更正的目标原事件ID}
        correctionReason: {type: [string, 'null'], maxLength: 500, description: 更正原因说明}
    CreateTraceEventRequest:
      type: object
      required: [eventType, occurredAt, dataSource, summary]
      properties:
        eventType: {$ref: '#/components/schemas/TraceEventType'}
        occurredAt: {type: string, format: date-time, description: "业务实际发生时间（ISO 8601 带明确时区偏移）"}
        siteId: {type: [integer, 'null'], format: int64, description: "发生场所ID；WAREHOUSE_IN / WAREHOUSE_OUT 必填，且必须为调用方组织启用的 COLD_STORE 场所"}
        dataSource: {$ref: '#/components/schemas/DataSource'}
        summary: {type: string, minLength: 1, maxLength: 500, description: 事件核心摘要说明}
        detailsJson: {$ref: '#/components/schemas/TraceEventDetailsJson'}
    CorrectTraceEventRequest:
      type: object
      required: [eventType, occurredAt, dataSource, summary, correctionReason]
      properties:
        eventType: {$ref: '#/components/schemas/TraceEventType'}
        occurredAt: {type: string, format: date-time, description: "修正后的业务实际发生时间（ISO 8601 带明确时区偏移）"}
        siteId: {type: [integer, 'null'], format: int64, description: "修正后的发生场所ID；WAREHOUSE_IN / WAREHOUSE_OUT 必填，且必须为调用方组织启用的 COLD_STORE 场所"}
        dataSource: {$ref: '#/components/schemas/DataSource'}
        summary: {type: string, minLength: 1, maxLength: 500, description: 修正后的事件核心摘要说明}
        detailsJson: {$ref: '#/components/schemas/TraceEventDetailsJson'}
        correctionReason: {type: string, minLength: 1, maxLength: 500, description: 更正原因说明}
    DataSource:
      type: string
      enum: [MANUAL, IMPORT, SIMULATED, DEVICE]
    PublicTraceCodeEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/PublicTraceCode'}
    PublicTraceCode:
      type: object
      additionalProperties: false
      required: [id, batchId, publicId, status, activatedAt, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        batchId: {type: integer, format: int64}
        publicId:
          type: string
          pattern: '^[A-Z2-7]{26}$'
          minLength: 26
          maxLength: 26
        status: {type: string, enum: [ACTIVE, DISABLED, RECALLED]}
        activatedAt: {type: string, format: date-time}
        disabledAt:
          type: [string, "null"]
          format: date-time
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PublicTrace:
      type: object
      additionalProperties: false
      required: [publicTraceId, product, batch, timeline, temperatureSummary, flowStatus, riskStatus, queriedAt, disclosure]
      properties:
        publicTraceId:
          type: string
          pattern: '^[A-Z2-7]{26}$'
          minLength: 26
          maxLength: 26
        product:
          type: object
          additionalProperties: false
          required: [name, category, specification]
          properties:
            name: {type: string}
            category: {type: string}
            specification: {type: string}
        batch:
          type: object
          additionalProperties: false
          required: [publicBatchNo, originType, maskedOrigin]
          properties:
            publicBatchNo: {type: string, description: 掩码后的企业外部批号；未填写外部批号时为 `****`。不暴露 traceBatchNo 或内部 ID}
            originType: {type: string}
            maskedOrigin: {type: string}
            productionDate: {type: string, format: date, description: 未填写时字段省略}
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [event, occurredAt, dataSourceLabel]
            properties:
              event: {type: string}
              occurredAt: {type: string, format: date-time}
              dataSourceLabel: {type: string}
        temperatureSummary:
          type: object
          additionalProperties: false
          required: [result, ruleNote]
          properties:
            result: {type: string, enum: [NO_BREACH_RECORDED, BREACH_RECORDED, INSUFFICIENT_DATA]}
            ruleNote: {type: string}
        flowStatus:
          allOf:
            - {$ref: '#/components/schemas/BatchFlowStatus'}
          description: 批次流转状态。公开码只能在 ACTIVE+NORMAL 时激活，因此实际为 ACTIVE 或 CLOSED；CLOSED 后已激活码继续可查询
        riskStatus: {$ref: '#/components/schemas/BatchRiskStatus'}
        recallNotice:
          type: string
          description: 仅当 riskStatus=RECALLED 时出现的模拟召回提示；其他情况字段省略
        queriedAt: {type: string, format: date-time}
        disclosure: {type: string}
    TransferStatus:
      type: string
      enum: [DRAFT, PENDING, ACCEPTED, REJECTED]
    Transfer:
      type: object
      additionalProperties: false
      required: [id, transferNo, batchId, senderOrgId, receiverOrgId, quantity, unitCode, status, version, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        transferNo: {type: string}
        batchId: {type: integer, format: int64}
        traceBatchNo: {type: string, description: 批次追溯批次号（接收方在取得批次权限前识别货物）}
        shipmentId:
          type: [integer, "null"]
          format: int64
          description: 绑定的运输任务 ID；DRAFT 可未绑定，提交后必然存在
        shipmentNo: {type: [string, "null"]}
        shipmentStatus:
          oneOf:
            - {$ref: '#/components/schemas/ShipmentStatus'}
            - {type: 'null'}
        senderOrgId: {type: integer, format: int64}
        receiverOrgId: {type: integer, format: int64}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001}
        unitCode: {type: string, enum: [kg]}
        status: {$ref: '#/components/schemas/TransferStatus'}
        shippedAt:
          type: [string, "null"]
          format: date-time
          description: 仅历史数据；物理发运时间以运输任务 loadedAt 为准，Slice 2 之后的交接不再写入
        submittedRecordedAt:
          type: [string, "null"]
          format: date-time
        submittedBy:
          type: [integer, "null"]
          format: int64
        receivedAt:
          type: [string, "null"]
          format: date-time
        decisionRecordedAt:
          type: [string, "null"]
          format: date-time
        decidedBy:
          type: [integer, "null"]
          format: int64
        receivedQuantity:
          type: [number, "null"]
          multipleOf: 0.001
        differenceReason:
          type: [string, "null"]
        rejectionReason:
          type: [string, "null"]
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TransferEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Transfer'}
    TransferListEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/Transfer'}
    TransferCreateRequest:
      type: object
      required: [batchId, receiverOrgId]
      additionalProperties: false
      properties:
        batchId: {type: integer, format: int64}
        receiverOrgId: {type: integer, format: int64}
    TransferPatchRequest:
      type: object
      required: [receiverOrgId, expectedVersion]
      additionalProperties: false
      properties:
        receiverOrgId: {type: integer, format: int64}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    TransferSubmitRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
    TransferAcceptRequest:
      type: object
      required: [receivedQuantity, unitCode, occurredAt, expectedVersion]
      additionalProperties: false
      properties:
        receivedQuantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001}
        unitCode: {type: string, enum: [kg]}
        occurredAt: {type: string, format: date-time}
        differenceReason:
          type: [string, "null"]
        expectedVersion: {type: integer, format: int64, minimum: 0}
    TransferRejectRequest:
      type: object
      required: [reason, occurredAt, expectedVersion]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        occurredAt: {type: string, format: date-time}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    SiteSummary:
      type: object
      additionalProperties: false
      required: [id, orgId, siteNo, name, siteType, status]
      properties:
        id: {type: integer, format: int64}
        orgId: {type: integer, format: int64}
        siteNo: {type: string}
        name: {type: string}
        siteType: {type: string, enum: [PORT, FARM, FACTORY, COLD_STORE, LOGISTICS_HUB, STORE]}
        status: {type: string}
    ShipmentStatus:
      type: string
      enum: [PLANNED, IN_TRANSIT, DELIVERED, CANCELLED]
    ShipmentPartyRef:
      type: object
      required: [id]
      properties:
        id: {type: integer, format: int64}
        orgNo: {type: string}
        name: {type: string}
        orgType: {type: string}
    ShipmentTransferItem:
      type: object
      required: [transferId, transferNo, batchId, quantity, unitCode, status, version]
      properties:
        transferId: {type: integer, format: int64}
        transferNo: {type: string}
        batchId: {type: integer, format: int64}
        traceBatchNo: {type: string}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.001}
        unitCode: {type: string, enum: [kg]}
        status: {$ref: '#/components/schemas/TransferStatus'}
        version: {type: integer, format: int64, minimum: 0}
    Shipment:
      type: object
      additionalProperties: false
      required: [id, shipmentNo, status, senderOrg, receiverOrg, carrierOrg, vehicleOrContainerNo, originSite, destinationSite, transfers, version, createdAt, updatedAt]
      description: 一次物理冷链运输；不改变 Batch 当前责任组织。值为 null 的字段在响应中省略。
      properties:
        id: {type: integer, format: int64}
        shipmentNo: {type: string}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        senderOrg: {$ref: '#/components/schemas/ShipmentPartyRef'}
        receiverOrg: {$ref: '#/components/schemas/ShipmentPartyRef'}
        carrierOrg: {$ref: '#/components/schemas/ShipmentPartyRef'}
        vehicleOrContainerNo: {type: string}
        originSite: {$ref: '#/components/schemas/SiteSummary'}
        destinationSite: {$ref: '#/components/schemas/SiteSummary'}
        loadedAt: {type: string, format: date-time, description: 装载发运业务时间（PLANNED 阶段省略）}
        unloadedAt: {type: string, format: date-time, description: 到达卸货业务时间}
        dispatchedRecordedAt: {type: string, format: date-time}
        dispatchedBy: {type: integer, format: int64}
        deliveredRecordedAt: {type: string, format: date-time}
        deliveredBy: {type: integer, format: int64}
        cancelledRecordedAt: {type: string, format: date-time}
        cancelledBy: {type: integer, format: int64}
        cancelReason: {type: string}
        transfers:
          type: array
          description: 装载清单（同一运输任务中的交接具有相同发送方、接收方、起点与终点）
          items: {$ref: '#/components/schemas/ShipmentTransferItem'}
        version: {type: integer, format: int64, minimum: 0, description: 乐观锁版本号；装载清单每次变化都会递增}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ShipmentEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Shipment'}
    ShipmentListEnvelope:
      allOf:
        - {$ref: '#/components/schemas/SuccessEnvelope'}
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/Shipment'}
            meta: {$ref: '#/components/schemas/PagedResponseMeta'}
    ShipmentCreateRequest:
      type: object
      required: [carrierOrgId, originSiteId, destinationSiteId, vehicleOrContainerNo]
      additionalProperties: false
      properties:
        carrierOrgId: {type: integer, format: int64}
        originSiteId: {type: integer, format: int64}
        destinationSiteId: {type: integer, format: int64}
        vehicleOrContainerNo: {type: string, minLength: 1, maxLength: 64}
    ShipmentBindTransferRequest:
      type: object
      required: [transferId, expectedTransferVersion]
      additionalProperties: false
      properties:
        transferId: {type: integer, format: int64}
        expectedTransferVersion: {type: integer, format: int64, minimum: 0}
    ShipmentDispatchRequest:
      type: object
      required: [loadedAt, expectedVersion]
      additionalProperties: false
      properties:
        loadedAt: {type: string, format: date-time, description: 装载发运业务时间，不得晚于服务端时钟 5 分钟以上}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    ShipmentArriveRequest:
      type: object
      required: [unloadedAt, expectedVersion]
      additionalProperties: false
      properties:
        unloadedAt: {type: string, format: date-time, description: 到达卸货业务时间，不得早于 loadedAt}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    ShipmentCancelRequest:
      type: object
      required: [reason, expectedVersion]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        expectedVersion: {type: integer, format: int64, minimum: 0}
security:
  - sessionCookie: []
