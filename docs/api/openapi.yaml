  /batch-operations:
    post:
      tags: [Batches]
      summary: 创建加工 (PROCESS) / 拆分 (SPLIT) 操作草稿，并由服务端生成 OUTPUT 草稿批次
      description: |
        仅限当前责任组织为 `PROCESSOR` 的 `OPERATOR`（平台 / 系统管理员 403 `ADMIN_RESTRICTED`；非操作员 403 `ACCESS_DENIED`；
        其他组织类型 403 `ORG_TYPE_NOT_ALLOWED`；输入批次不由本组织负责 403 `ORG_SCOPE_DENIED`）。
        - 恰好 1 个 INPUT；PROCESS 至少 1 个 OUTPUT，SPLIT 至少 2 个 OUTPUT，否则 400 `INVALID_REQUEST`；
        - `MERGE` / `REPACK`：422 `OPERATION_TYPE_NOT_SUPPORTED`（当前 Slice 范围限制，不是永久业务规则）；
        - OUTPUT 携带 `batchId`：400 `OUTPUT_BATCH_SERVER_GENERATED`；
        - INPUT 数量不等于当前剩余量：422 `PARTIAL_INPUT_NOT_ALLOWED`；物料不平衡：422 `BATCH_MASS_BALANCE_VIOLATION`；
        - 输入批次已关闭或已被消耗：409 `BATCH_ALREADY_CONSUMED`；非 ACTIVE+NORMAL：422 `BATCH_FLOW_BLOCKED`；
          存在草稿或待接收交接：409 `BATCH_TRANSFER_OPEN`。
        创建阶段不改变输入批次状态。同组织相同 `Idempotency-Key` 且语义相同时重放原操作；语义不同或该键属于已删除草稿时
        409 `IDEMPOTENCY_CONFLICT`。
      operationId: createBatchOperation
      parameters:
        - {$ref: '#/components/parameters/CsrfHeader'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBatchOperationRequest'}
      responses:
        '201':
          description: 操作草稿（OUTPUT 批次已生成为 DRAFT）
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/BatchOperation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [Batches]
      summary: 按批次查询引用该批次（INPUT 或 OUTPUT）的批次操作
      description: |
        企业用户只返回**本组织创建**的操作，绝不暴露其他企业的内部单据。允许条件：当前责任组织，
        或本组织曾对该批次执行过操作（历史参与，只读）；其他组织 403 `ORG_SCOPE_DENIED`。PLATFORM 只读角色返回全部。
      operationId: listBatchOperations
      parameters:
        - name: batchId
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 批次操作分页列表（按 ID 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/BatchOperation'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /batch-operations/{operationId}:
    get:
      tags: [Batches]
      summary: 查询批次操作详情
      description: |
        操作所属组织的任意用户（含 `QUALITY_MANAGER`）可读，即使相关批次此后已转出（历史只读）；PLATFORM 只读角色可读；
        其他组织 403 `ORG_SCOPE_DENIED`；不存在 404。
      operationId: getBatchOperation
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 批次操作详情
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/BatchOperation'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Batches]
      summary: 删除批次操作草稿
      description: |
        仅 `DRAFT` 可删除（否则 409 `INVALID_STATE_TRANSITION`），版本不一致 409 `VERSION_CONFLICT`。
        同一事务内逻辑删除操作、明细及其服务端生成的全部 OUTPUT 草稿批次；输入批次状态不变。写权限同创建。
      operationId: deleteBatchOperation
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: expectedVersion, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      responses:
        '204': {description: 草稿已删除}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /batch-operations/{operationId}/submit:
    post:
      tags: [Batches]
      summary: 提交批次操作：原子关闭 INPUT、激活 OUTPUT、固化谱系边；PROCESS 自动生成 PROCESS 追溯事件
      description: |
        写权限同创建；锁内重新校验全部前提（输入批次仍由本组织负责、ACTIVE+NORMAL、未被消耗、无未结束交接、
        INPUT = 当前剩余量；OUTPUT 仍是本操作产出的 DRAFT 草稿，否则 409 `OPERATION_OUTPUT_STATE_INVALID`；精确物料平衡）。
        同一事务内：INPUT → `CLOSED`（记录 `consumedByOperationId`），OUTPUT → `ACTIVE`，写入 BatchRelation
        （PROCESS 为 `TRANSFORM`，SPLIT 为 `SPLIT`）；PROCESS 为每个 OUTPUT 生成一条 PROCESS 事件（记录组织为执行组织，
        业务时间为操作 `occurredAt`），SPLIT 不生成 PACK / PROCESS。任一步失败整体回滚（PROCESS 事件身份冲突时 409
        `PROCESS_EVENT_CONFLICT`）。同一 `Idempotency-Key` 重放返回原结果；已提交后换键再提交 409 `INVALID_STATE_TRANSITION`。
      operationId: submitBatchOperation
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - {$ref: '#/components/parameters/CsrfHeader'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitBatchOperationRequest'}
      responses:
        '200':
          description: 已提交，INPUT 已关闭、OUTPUT 已激活、谱系边已创建
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/BatchOperation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /batches/{batchId}/events:
    get:
      tags: [Trace]
      summary: 查询批次追溯事件
      description: |
        读取范围（统一业务契约 v1.1 §14）：
        - 当前责任组织与 PLATFORM 只读角色：该批次完整时间线，包括前序责任组织记录的 SOURCE / TRANSPORT / ARRIVAL / PROCESS；
        - 历史参与组织（批次已转出，但本组织曾在该批次记录事件）：只返回本组织记录的历史事件，只读；
        - 其他组织：403 `ORG_SCOPE_DENIED`。
      operationId: listBatchEvents
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
      responses:
        '200':
          description: 事件列表
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/TraceEvent'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Trace]
      summary: 提交批次追溯事件（仅限企业操作员）
      description: |
        受控人工事件接口。`SOURCE`（来源批次激活）、`PROCESS`（加工批次操作提交）、`TRANSPORT`（运输任务发运）、`ARRIVAL`（运输任务到达）、
        `SALE`（终端销售，Sale 台账尚未实现）只能由结构化业务对象自动生成，本接口拒绝创建，返回 422 `EVENT_TYPE_NOT_MANUAL`。
        `Idempotency-Key` 不得以服务端保留前缀 `SYS:` 开头（400 `INVALID_REQUEST`）。
        只有批次当前责任组织可写，跨组织 403 `ORG_SCOPE_DENIED`（先于场所校验）；批次必须为 `ACTIVE` + `NORMAL`，否则 422 `BATCH_FLOW_BLOCKED`；
        同 key 不同载荷 409 `IDEMPOTENCY_CONFLICT`，同 key 同载荷重放原事件。

        **自有冷库出入库 `WAREHOUSE_IN` / `WAREHOUSE_OUT`（统一业务契约 v1.1 §8，Phase A Slice 4）**：
        - `siteId` 必填（400 `INVALID_REQUEST`），场所不存在 404；
        - 场所必须属于调用方组织（即批次当前责任组织），否则 403 `ORG_SCOPE_DENIED`；不支持第三方仓储；
        - 场所必须启用，否则 422 `SITE_NOT_ACTIVE`；场所类型必须为 `COLD_STORE`，否则 422 `WAREHOUSE_SITE_TYPE_INVALID`；
        - `dataSource` 必须为 `MANUAL`，且不接受 `detailsJson`（400 `INVALID_REQUEST`），说明写入 `summary`；
        - 组织类型不受限，只要求当前责任组织；
        - 仓储事件只追加追溯事实，不修改批次责任组织、数量、剩余量、流转 / 风险状态与版本，不产生批次、谱系、交接或运输记录；
        - **当前 Slice 的最小实现解释**：统一业务契约 v1.1 未定义仓储状态机，因此服务端不强制 IN / OUT 配对或顺序
          （无前序 IN 的 OUT、连续两次 IN、在冷库 A 入库后从冷库 B 出库均被接受），也不派生“当前在库”状态；
          运输途中能否记录仓储事件在 v1.1 中未定义，当前不做限制。
      operationId: createTraceEvent
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTraceEventRequest'}
      responses:
        '201':
          description: 已提交事件
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/TraceEvent'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /batches/{batchId}/events/{eventId}/corrections:
    parameters:
      - {$ref: '#/components/parameters/BatchId'}
      - name: eventId
        in: path
        required: true
        schema: {type: integer, format: int64}
        description: 被更正的目标原追溯事件ID
    post:
      tags: [Trace]
      summary: 对历史追溯事件提交追加式更正记录（仅限企业操作员）
      description: |
        不能把事件更正为 `SOURCE` / `PROCESS` / `TRANSPORT` / `ARRIVAL` / `SALE`（422 `EVENT_TYPE_NOT_MANUAL`），
        也不能更正由系统自动生成的这些事件（422 `AUTO_EVENT_NOT_CORRECTABLE`）。
        `Idempotency-Key` 不得以服务端保留前缀 `SYS:` 开头（400 `INVALID_REQUEST`）。
        调用方必须同时是批次当前责任组织与原事件记录组织（403 `ORG_SCOPE_DENIED`）；批次必须为 `ACTIVE` 或 `CLOSED`，且 `NORMAL`（422 `BATCH_FLOW_BLOCKED`）。

        **冷库出入库事件更正**：更正是追加式审计更正，不是新的仓储流转，因此 `CLOSED` 批次仍允许更正既有仓储事件
        （`CLOSED` 批次新建 `WAREHOUSE_IN` / `WAREHOUSE_OUT` 仍被拒绝）。约束：
        - 只能在 `WAREHOUSE_IN` ↔ `WAREHOUSE_OUT` 之间更正；仓储事件不能更正为其他类型，其他事件也不能更正为仓储事件
          （422 `WAREHOUSE_EVENT_TYPE_CHANGE_FORBIDDEN`）；
        - 新版本同样适用创建时的场所规则：`siteId` 必填、本组织、启用、`COLD_STORE`、`MANUAL`、无 `detailsJson`。
        - `FROZEN` / `RECALLED` 批次的更正语义留待 Phase B，当前保持仅 `NORMAL` 可更正。
      operationId: correctTraceEvent
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectTraceEventRequest'}
      responses:
        '201':
          description: 更正事件已追加且原事件状态流转为 CORRECTED
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/SuccessEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/TraceEvent'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /transfers:
    get:
      tags: [Transfers]
      summary: 分页查询当前企业相关的交接凭证
      operationId: listTransfers
